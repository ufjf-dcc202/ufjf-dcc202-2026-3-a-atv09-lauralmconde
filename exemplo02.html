<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 Exemplo02</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul>li {
            border: 1px solid green;
            background-color: lightgreen;
        }
        .desconstructed-pancake{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .desconstructed-pancake > * {
            flex: 1 0 120px;
        }
    </style>
</head>

<body>
    <main>
        <article>
            <ul class="desconstructed-pancake">
                <li>Lorem, ipsum.</li>
                <li>Animi, quia.</li>
                <li>Nam, nostrum.</li>
                <li>Totam, reiciendis!</li>
            </ul>
        </article>
    </main>
</body>

</html>
